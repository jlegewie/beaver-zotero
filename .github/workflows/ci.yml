name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck CLI
        run: npm run typecheck:cli

      # Both packages have landed, so neither is `--if-present` any more: that
      # flag turns a renamed or deleted script into a green no-op, which is the
      # one failure a gate must not have.
      - name: Typecheck agent-core
        run: npm run typecheck:core

      # Same pattern for the shared React layer: standalone typecheck plus the
      # closure gate, with neither zotero-types nor @types/office-js present.
      - name: Typecheck agent-ui
        run: npm run typecheck:ui

      # eslint directly rather than lint:check — the prettier half of that
      # script is a separate, repo-wide formatting decision.
      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test
