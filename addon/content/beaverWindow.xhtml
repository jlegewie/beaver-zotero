<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/overlay.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://beaver/content/styles/agent-ui-tokens.css" type="text/css"?>
<?xml-stylesheet href="chrome://beaver/content/styles/agent-ui-utilities.css" type="text/css"?>
<?xml-stylesheet href="chrome://beaver/content/styles/agent-ui-components.css" type="text/css"?>
<?xml-stylesheet href="chrome://beaver/content/styles/beaver.css" type="text/css"?>
<?xml-stylesheet href="chrome://beaver/content/styles/katex-embedded.css" type="text/css"?>
<!DOCTYPE window>
<window
    id="beaver-window"
    orient="vertical"
    width="450"
    height="700"
    minwidth="400"
    title="Beaver"
    persist="screenX screenY width height"
    windowtype="beaver:window"
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
>
    <script type="application/javascript" src="chrome://beaver/content/beaverWindow.js"/>

    <!-- React mount point. `beaver-root` is the scoping root for the shared
         @beaver/agent-ui sheets, which select `.beaver-root .foo`; it belongs on
         every element carrying a `beaver-pane-*` id. -->
    <html:div id="beaver-pane-window" class="beaver-root display-flex flex-1 flex-col h-full w-full min-w-0" style="height: 100%; width: 100%; display: flex;"></html:div>
</window>
